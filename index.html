<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>SpaceShooter</title>
    <link rel="icon" type="image/x-icon" href="./images/favicon.ico">
  <script type="module" crossorigin src="./assets/index-DTHAtxjH.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BcrONI8A.css">
</head>
<body>
    <div id="gameContainer">
        <div id="resizableContainer">
            <canvas id="renderCanvas"></canvas>
            <div id="GameGUI">
                <div id="HelpPanel">
                    <div id="HelpText1">Actual localized texts</div>
                    <div id="HelpText2">you can find in</div>
                    <div id="HelpText3">js/Utils/lang.js</div>
                    <div id="HelpText4"></div>
                </div>
                <div id="TutorPanel">TXT_MISSILE_INFO</div>
                <div id="InfoPanel">
                    <div id="MissileCount"></div>
                    <div id="EnemiesCount"></div>
                </div>
                <div id="LoadingText"><div>TXT_LOADING</div></div>
            </div>
        </div>
    </div>
    <div id="DebugPanel">
        <div id="game_fps" class="dbg_txt">0</div>
        <div id="dist" class="dbg_txt">0</div>
        <div id="fwd_vel" class="dbg_txt">0</div>
    </div>
    <div id="MainMenu">
        <div id="MenuPanel">
            <div id="GameTitle" style="font-size: 5vh;">Space shooter</div>
            <div style="display: grid; justify-items: center;">
                <div id="EnemyNumberTxt" style="font-size: 2.5vh;">Number of enemies:</div>
                <div style="font-size: 4vh;" id="EnemyNumber">3</div>
                <div><input type="range" id="EnemyNumberSlider" min="1" max="9" step="1" value="3"></div>
            </div>
            <div style="display: grid; justify-items: center;">
                <div style="display: grid; grid-template-columns: 1fr 3vw; justify-items: center; margin-bottom: 2vh;">
                    <label for="Sounds" id="SoundsLabel">Sounds</label>
                    <input type="checkbox" id="SoundsCheckbox" onchange="setSoundsOnOff()">
                </div>
                <!--div id="VolumeTxt" style="font-size: 2.0vh;">Volume</div>
                <div><input type="range" id="VolumeSlider" min="0" max="100" step="1" value="25"></div-->
            </div>
            <div id="PlayTxt" class="ncw_btn" style="top: 46vh; left: 46vw;font-size: 2.5vh;z-index: 9;width: 5vw; pointer-events: none;" onmousedown="startGame()">Play</div>
        </div>
    </div>
</body>
</html>
